[package]
name = "grademarket"
version = "0.1.0"
description = "Pari-mutuel prediction markets on student grades, settled in SOL"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "grademarket"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
